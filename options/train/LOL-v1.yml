#### general settings
name: train
use_tb_logger: false
model: enhancement_model
distortion: sr
scale: 1
gpu_ids: [1]

#### datasets
datasets:
  train:
    name: lolv1
    interval_list: [1]
    random_reverse: false
    border_mode: false
    dataroot_GT: /home/zts/000_Datasets/000_LOL-v1/our485/high/
    dataroot_LQ: /home/zts/000_Datasets/000_LOL-v1/our485/low/
    dataroot_FR: /home/zts/000_Datasets/000_LOL-v1/our485/high/

    n_workers: 3  # per GPU
    batch_size: 8
    GT_size: 256   # size you want to crop out as input sample.
    LQ_size: 256
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: ll_dataset
    dataroot_GT: /home/zts/000_Datasets/000_LOL-v1/eval15/high/
    dataroot_LQ: /home/zts/000_Datasets/000_LOL-v1/eval15/low/
    dataroot_FR: /home/zts/000_Datasets/000_LOL-v1/eval15/high/
    train_size: [600, 400]

#### network structures
network_G:
  which_model_G: SPJFNet
  latt_nf: 8
  first_stage_nf: 8
  second_stage_nf: 32

#### path
path:
  root: ./
  strict_load: false

#### training settings: learning rate scheme, loss
train:
  lr_G: 0.0005
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 200000
  lr_steps: [80000, 140000, 180000]
  ft_tsa_only: 0
  warmup_iter: -1  # -1: no warm up
  lr_gamma: 0.5
  eta_min: !!float 1e-7
  pixel_criterion: l1
  pixel_weight: 1.0
  val_freq: !!float 1e3
  manual.resize960x512_seed: 0
  vgg_loss: false
  gammanet_epoch : 300
  T_period: [100, 100000]


#### logger
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1000
